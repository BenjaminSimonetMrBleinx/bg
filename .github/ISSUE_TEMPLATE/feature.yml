name: 🔨 Je propose une feature
description: Une mission, un système, un morceau de jeu entier
labels: ["🔨 chantier", "🧊 plus tard"]
body:
  - type: markdown
    attributes:
      value: |
        **Le titre : ce qui existera quand ce sera fini**, sous la forme
        `Domaine — le résultat`. « Famille — rapporter les courses à la
        maison », pas « faut faire les courses ».

        Le brief de la mission 1 a produit quinze étapes et quatre décors en
        une soirée. Ces trois questions sont celles qui avaient manqué.

  - type: dropdown
    id: domaine
    attributes:
      label: Quel domaine ?
      options:
        - Économie
        - Ville
        - Intérieurs
        - Monde
        - Son
        - Personnages
        - Missions
        - Famille
        - Réglage
    validations: { required: true }

  - type: textarea
    id: sert
    attributes:
      label: Ça sert à quoi, pour le joueur ?
      description: Ce qu'il peut faire qu'il ne pouvait pas avant.
    validations: { required: true }

  - type: textarea
    id: fini
    attributes:
      label: À quoi on voit que c'est fini ?
      description: >
        **LA question qui manque le plus souvent.** Le brief de la mission 1
        intitulait son étape « Cacher la Meth » et son contenu parlait de
        cacher l'argent : il a fallu deviner.
    validations: { required: true }

  - type: textarea
    id: refs
    attributes:
      label: Des références ?
      description: Images, sons, extraits. À déposer dans `livraisons/references/`.
