name: 🐛 J'ai trouvé un bug
description: Quelque chose ne marche pas, ou pas comme prévu
labels: ["🐛 bug", "🔥 maintenant"]
body:
  - type: markdown
    attributes:
      value: |
        **Le titre : dis ce que tu as VU**, pas ce qu'il faudrait réparer.
        « Jesse parle hors contexte au camping-car » — on cherche un bug avec
        ce qu'on a sous les yeux.

        Si le bug est déjà dans la liste, un commentaire « chez moi aussi »
        vaut mieux qu'un doublon.

  - type: dropdown
    id: domaine
    attributes:
      label: Ça se passe où ?
      options:
        - Ville
        - Désert
        - Intérieurs
        - Missions
        - Personnages
        - Son
        - Voiture
        - Interface et menus
        - Je ne sais pas
    validations: { required: true }

  - type: textarea
    id: passe
    attributes:
      label: Qu'est-ce qui s'est passé ?
      description: Et ce que tu attendais à la place, si tu le sais.
      placeholder: |
        Je roulais vers le désert, je venais de parler à Jesse chez lui.
        Arrivé au camping-car, il m'a dit que j'étais en retard — alors que
        je n'avais encore rien commencé.
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: Quelle version ?
      description: Affichée en haut à droite de l'écran, en tout petit.
      placeholder: v0.48.13
    validations: { required: true }

  - type: textarea
    id: image
    attributes:
      label: Une capture ?
      description: >
        Glisse-la ici. Facultatif — mais dans ce projet, presque tout ce qui a
        été trouvé l'a été sur une image.
